# Reconciliation — the authority on completeness.
#
# Requirements: CICD-001.3.6, CICD-001.3.7, SRV-001.8
#
# The push trigger in evidence-main.yml is a latency optimization, not a
# completeness guarantee: webhooks are missed, jobs are skipped, and push
# payloads truncate their commit lists on large pushes. This job walks the
# protected ref and diffs it against the landing chain, in both directions:
#   - a commit on the ref with no landing record
#   - a landing record with no commit on the ref
# Git is itself an append-only content-addressed log, which is what makes the
# comparison cheap.
name: Evidence — reconcile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # findings need an owner — CICD-001.3.7
  id-token: write

jobs:
  reconcile:
    name: evidence/reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — REPLACE
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Reconcile protected refs
        uses: ai-outfitter/pensieve/actions/reconcile@0000000000000000000000000000000000000000 # v0.1.0 — REPLACE
        with:
          sink: ${{ vars.PENSIEVE_SINK }}
          sink_key: ${{ vars.PENSIEVE_SINK_KEY }}
          refs: refs/heads/main
          policy: .github/pensieve.yml
          # Findings append; they never mutate an existing record.
          # One tracking issue, updated in place, assigned to the policy owner.
          report: issue
          issue_label: pensieve-finding
          on_sink_unreachable: fail
