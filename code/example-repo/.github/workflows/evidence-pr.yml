# Tier 1 — preventive. Every commit under review must carry sealed evidence.
#
# Requirements: CICD-001.1, CICD-001.2, CICD-001.6, CICD-001.7
#
# This file must live on the default branch. For `pull_request`, GitHub reads
# the workflow definition from the default branch, so a pull request cannot
# edit this gate. It CAN edit the code this job checks out, which is why the
# job below runs no repository code (CICD-001.1.4).
name: Evidence — pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    # Required. The queue merges content the pull-request check never saw.
    # CICD-001.2.5
    types: [checks_requested]

permissions:
  contents: read # history only; no write, no deploy
  id-token: write # OIDC exchange with the sink — CICD-001.6.1

concurrency:
  group: evidence-pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  # The job name is the required status-check context named by the ruleset.
  # It MUST be identical on both events or the queue never satisfies the rule.
  # CICD-001.2.6
  commits:
    name: evidence/commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # History only. Nothing from this checkout is executed: no install, no
      # build, no test. The verifier must not be subvertible by the ref it
      # judges. CICD-001.1.4, CICD-001.1.5
      - name: Fetch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — REPLACE with your pinned digest
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # Per-commit coverage over base..head. The action resolves the merge base
      # itself rather than trusting the event's base SHA.
      # CICD-001.2.1 – CICD-001.2.4, CICD-001.2.7 – CICD-001.2.10
      - name: Verify commit evidence
        uses: ai-outfitter/pensieve/actions/verify-commits@0000000000000000000000000000000000000000 # v0.1.0 — REPLACE with a real 40-char digest (CICD-001.1.6)
        with:
          # Organization-level, never read from the ref under review.
          # CICD-001.1.7
          sink: ${{ vars.PENSIEVE_SINK }}
          sink_key: ${{ vars.PENSIEVE_SINK_KEY }}
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          # Repository policy may tighten the org floor, never loosen it.
          # CICD-001.1.8
          policy: .github/pensieve.yml
          # Unreachable sink fails the check. It never skips. CICD-001.7.1
          on_sink_unreachable: fail
          # Per-commit table into the run summary. CICD-001.2.9
          summary: true

      # Always runs, and reports success without enforcement when this is not a
      # release pull request. A check that only reports on some events leaves a
      # pending status that blocks unrelated merges.
      # CICD-001.1.9, CICD-001.2.11
      - name: Verify release range
        uses: ai-outfitter/pensieve/actions/verify-range@0000000000000000000000000000000000000000 # v0.1.0 — REPLACE
        with:
          sink: ${{ vars.PENSIEVE_SINK }}
          sink_key: ${{ vars.PENSIEVE_SINK_KEY }}
          mode: release-pr
          # release-please labels its pull request; on any other pull request
          # the action reports "not a release" and succeeds.
          release_label: "autorelease: pending"
          on_sink_unreachable: fail
