name: release image

on:
  # release-please.yml owns the release path and calls this workflow directly.
  # Deliberately no `release: published` trigger — release-please creates the
  # release with a PAT, and PAT-created events do start workflow runs, so that
  # trigger would race a second identical build against this one.
  workflow_call:
    inputs:
      release_tag:
        description: Immutable release tag created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # type=gha cache reads and writes the Actions cache. Without this scope the
  # cache silently no-ops and every release re-runs the emulated arm64 install —
  # a slow build that still succeeds, so nothing would surface the mistake.
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag stays conventional (v0.1.0); the OCI version label must be strict
      # semver, because chart appVersion updaters and scanners parse it as such.
      - name: Derive the semver version from the release tag
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The arm64 leg builds under QEMU, so caching the dependency stage is
          # what keeps a release build from re-running an emulated bun install.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
