name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The S3 store test is the one that proves the integrity model: that the
      # object store rejects mismatched bytes and refuses to let a client weaken
      # the retention lock. It is gated on PENSIEVE_S3_TEST_ENDPOINT, so without
      # a store it silently skips — which is exactly the test least worth having
      # optional. A service container cannot pass MinIO its `server /data`
      # argument, so it runs as a step.
      - name: Start MinIO for the store integration test
        working-directory: .
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=pensieve \
            -e MINIO_ROOT_PASSWORD=pensieve-dev-secret \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2 || true
          exit 1

      - run: bun run test
        env:
          PENSIEVE_S3_TEST_ENDPOINT: http://127.0.0.1:9000

      - run: bun run typecheck
