name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The S3 store test is the one that proves the integrity model: that the
      # object store rejects mismatched bytes and refuses to let a client weaken
      # the retention lock. It is gated on PENSIEVE_S3_TEST_ENDPOINT, so without
      # a store it silently skips — which is exactly the test least worth having
      # optional. RustFS is the self-hosted store (Object Lock, versioning); the
      # test creates its own lock-enabled bucket.
      - name: Start RustFS for the store integration test
        working-directory: .
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 \
            -e RUSTFS_ACCESS_KEY=pensieve \
            -e RUSTFS_SECRET_KEY=pensieve-dev-secret \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            docker.io/rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/health; then exit 0; fi
            sleep 2
          done
          echo "RustFS did not become healthy" >&2
          docker logs rustfs >&2 || true
          exit 1

      - run: bun run test
        env:
          PENSIEVE_S3_TEST_ENDPOINT: http://127.0.0.1:9000

      - run: bun run typecheck
