name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  # A called workflow's permissions are the INTERSECTION of caller and callee.
  # release-images.yml needs actions:write for its type=gha build cache, and a
  # callee cannot grant itself a scope the caller lacks — GitHub rejects the
  # whole workflow at startup, before any job runs.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # The org blocks the default GITHUB_TOKEN from creating PRs, so use
          # the established organization-scoped release token — same convention
          # as ai-outfitter/outfitter.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-images.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
